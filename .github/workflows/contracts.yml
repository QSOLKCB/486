name: foundation-contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-checks:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node --test
      - name: Check whitespace on pull request merge or selected manual revision
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^ HEAD
      - name: Check whitespace for the push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/check-push-whitespace.mjs "$BEFORE" "$AFTER"

  deploy-pages:
    # Publishing requires an explicit maintainer dispatch of the main branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: reference-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      # Keep queued manual deployments rather than replacing an earlier pending run.
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check tested commit is still main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run after obtaining the deployment concurrency slot. API failures
          # fail the job instead of deploying an unchecked revision.
          live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$live_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot verify main head" >&2; exit 1; }
          if [[ "$live_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping outdated main commit ${GITHUB_SHA}."
          fi
      - name: Check Pages publishing source
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Pages API schema permits build_type to be absent or null.
          # In that case the API cannot confirm the setting; do not change it.
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq 'if .build_type == null then "__not_reported__" elif .build_type == "workflow" then "workflow" elif .build_type == "legacy" then "legacy" else "__invalid__" end')" || { echo "::error::Unable to read Pages settings; verify Pages access and Source in Settings > Pages."; exit 1; }
          case "$build_type" in
            workflow) echo "Pages source is GitHub Actions." ;;
            legacy) echo "::error::Set Settings > Pages > Source to GitHub Actions."; exit 1 ;;
            __not_reported__) echo "::warning::Pages API did not report build_type; source could not be verified." ;;
            *) echo "::error::Pages API returned an unexpected build_type."; exit 1 ;;
          esac
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.head.outputs.current == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Stage static application
        if: steps.head.outputs.current == 'true'
        run: |
          mkdir -p _site
          cp index.html LICENSE README.md GETTING_STARTED.md _site/
          cp -R ui cpu bus devices machine storage fixtures contracts docs _site/
          mkdir -p _site/tools
          cp -R tools/native-oracle _site/tools/
          mkdir -p _site/tools/marked
          cp tools/marked/README.md tools/marked/LICENSE.md _site/tools/marked/
          node scripts/render-pages.mjs _site
      - name: Upload Pages artifact
        if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - name: Deploy Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
